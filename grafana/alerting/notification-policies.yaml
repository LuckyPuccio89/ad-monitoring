apiVersion: 1

policies:
  - orgId: 1
    receiver: email-ad
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # I rischi strutturali (single DC, forest legacy) non sono guasti:
      # una notifica al giorno è sufficiente.
      - receiver: email-ad
        object_matchers:
          - ['severity', '=', 'info']
        group_wait: 5m
        group_interval: 1h
        repeat_interval: 24h

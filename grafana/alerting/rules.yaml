apiVersion: 1
groups:
- orgId: 1
  name: ad-availability
  folder: Active Directory
  interval: 60s
  rules:
  - uid: ad-target-down
    title: 'AD: collector non raggiungibile'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dg13jav59r8cgd
      model:
        editorMode: code
        expr: up{job="ad-dc"}
        instant: true
        range: false
        intervalMs: 60000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 60000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 3m
    labels:
      severity: critical
      domain: example.lan
    annotations:
      summary: Prometheus non riesce a scrapare l'exporter AD
      description: 'up{job="ad-dc"} è 0 da 3 minuti: verificare ad-monitor.service e la rete Docker.'
    isPaused: false
  - uid: ad-collector-failed
    title: 'AD: raccolta fallita'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dg13jav59r8cgd
      model:
        editorMode: code
        expr: ad_collector_success
        instant: true
        range: false
        intervalMs: 60000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 60000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Alerting
    for: 5m
    labels:
      severity: warning
      domain: example.lan
    annotations:
      summary: L'ultimo giro di raccolta ha avuto errori
      description: 'Una o più sezioni del collector sono fallite: vedere ad_collector_section_ok e il NOTE nel payload.'
    isPaused: false
  - uid: ad-collector-stale
    title: 'AD: metriche non aggiornate'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dg13jav59r8cgd
      model:
        editorMode: code
        expr: time() - ad_collector_last_run_timestamp_seconds
        instant: true
        range: false
        intervalMs: 60000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 180
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 60000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    labels:
      severity: critical
      domain: example.lan
    annotations:
      summary: L'ultima raccolta risale a più di 3 minuti
      description: 'Il collector è fermo o bloccato: systemctl status ad-monitor e journalctl -u ad-monitor.'
    isPaused: false
  - uid: ad-collector-partial
    title: 'AD: raccolta parziale'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dg13jav59r8cgd
      model:
        editorMode: code
        expr: ad_collector_partial_errors
        instant: true
        range: false
        intervalMs: 60000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 60000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Alerting
    for: 10m
    labels:
      severity: warning
      domain: example.lan
    annotations:
      summary: Più sezioni di raccolta falliscono
      description: 'Degrado parziale ma persistente: controllare identity, directory e dns nel pannello sezioni.'
    isPaused: false
